distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 国内网络访问 services.gradle.org 很慢，改用腾讯云镜像。
# 用 -all 而不是 -bin：-all 自带 src/ 源码，IDEA 会直接用它做构建脚本的源码补全，
# 从而不再单独去官方源下载 gradle-<版本>-src.zip（官方源在国内经常超时）。
# 备用镜像：https\://mirrors.huaweicloud.com/gradle/gradle-7.6.4-all.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-7.6.4-all.zip
networkTimeout=10000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
